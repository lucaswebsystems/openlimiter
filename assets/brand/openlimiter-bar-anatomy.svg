  <rect width="900" height="176" rx="20" fill="#0E131B"/>
  <text x="48" y="50" fill="#FAFAFA" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="16" font-weight="600">5 hour</text>
  <rect x="48" y="76" width="640" height="10" rx="5" fill="#202B3B"/>
