# Antigravity's documented status line standard input payload.

provider_id: google
product_id: antigravity
display_name: Antigravity

headlineMeter: session_5h
weeklyMeter: weekly_7d
acquisitionSurfaces:
  - desktop
  - cli
displaySurfaces:
  - desktop
  - rail
  - tray
  - cli_cache
  - web
  - phone
platforms:
  - windows
  - macos
  - linux
acquisitionMethod: statusline_payload
d5Review: Documented status line payload with no credential access or network request.
maturity: headline
directory:
  order: 3
  rowId: google/antigravity
  label: Antigravity
  connectorId: antigravity
  access: automatic

source:
  docs_url: https://antigravity.google/docs/cli/statusline/
  reviewed_at: "2026-10-02"
