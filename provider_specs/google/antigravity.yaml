availability:
  requires_plan: any
  appears_after: quota_present
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: not_required

connections:
  - reader: statusline_payload
    auth_mode: existing_local_cli
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: "2026-10-02"
  fixture_ids:
    - antigravity.documented.statusline

honesty:
  connector_id: antigravity
  credential_origin: official-local-tool
  data_interface_status: native-statusline-payload
  automation_risk: low
  verification: UNVERIFIED

meters:
  - id: session_5h
    label: 5 hour quota
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 18000
    source_path: quota.buckets.remaining_fraction
    reset_path: quota.buckets.reset_time
    reset_encoding: rfc3339
    optional: true
    meter_code: FIVE_HOUR

  - id: weekly_7d
    label: Weekly quota
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 604800
    source_path: quota.buckets.remaining_fraction
    reset_path: quota.buckets.reset_time
    reset_encoding: rfc3339
    optional: true
    meter_code: SEVEN_DAY

  - id: third_party_session
    label: Third party 5 hour quota
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 18000
    source_path: quota.buckets.remaining_fraction
    reset_path: quota.buckets.reset_time
    reset_encoding: rfc3339
    optional: true
    meter_code: THIRD_PARTY_SESSION

  - id: third_party_weekly
    label: Third party weekly quota
    kind: subscription_quota
    unit: percent_used
    scope: account
