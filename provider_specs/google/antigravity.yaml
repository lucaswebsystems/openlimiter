# Antigravity, Google's coding tool. Documents an existing shipped
# connector, packages/connectors/src/antigravity.ts, not third party
# research: like Codex, its header comment states "This interface is
# UNOFFICIAL and may break." The parser is real and exercised by the
# fixture named below; nothing in this repository locates or fetches the
# payload it parses, some external process must already have written it
# and handed it in, which is why reader is absent even though parser is
# implemented.
#
# parseAntigravityPayload reads quota.used_percent and quota.reset_at, the
# second parsed as a date string through futureInstant. The window carries
# no duration or calendar rule in the parser, internally typed only as
# "fixed," which this registry states as provider_defined rather than
# guessing a length the code does not state. A payload missing either
# field is refused whole, so this one meter is not marked optional.
#
# This file covers Antigravity specifically. Google's other surfaces,
# consumer Gemini, Gemini CLI, and the Gemini API, are and must stay
# separate credentials and separate spec files; see google/gemini-cli.yaml.

provider_id: google
product_id: antigravity
display_name: Antigravity

source:
  docs_url: packages/connectors/src/antigravity.ts
  reviewed_at: "2026-08-10"
  source_status: provisional

availability:
  requires_plan: any
  appears_after: quota_json_present
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: implemented

# The live collection block. See openai/codex.yaml for why no URL, method or
# header appears in this file.
#
# Request contract, recorded 2026-08-07 from a working reader:
#   POST https://daily-cloudcode-pa.googleapis.com/v1internal:
#     retrieveUserQuotaSummary with an empty JSON object as the whole body
#   Authorization: Bearer <the login the Antigravity client already holds>
#   a NON EMPTY User-Agent, which is not optional: the same valid token is
#     answered 403 when the header is absent, measured 2026-08-07
#   redirects refused, response bounded
collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: antigravity_quota
      endpoint_id: antigravity_quota
      credential_kind: antigravity_session
      evidence_fixture: antigravity.sanitized_live.quota
      evidence_status: pending_capture
      last_verified_at: null

connections:
  - reader: experimental
    auth_mode: existing_local_cli
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  fixture_ids:
    - antigravity.provisional.quota
    - antigravity.sanitized_live.quota

# The response states remaining quota as a FRACTION between zero and one, per
# bucket, over two windows. Usage is one minus that fraction, and the meter
# below reports whichever window is binding, meaning the one that will stop the
# work first. The third party pool that rides the same subscription is a real
# second wallet and is deliberately not modelled here: it needs its own identity
# before it can have a meter, and folding it into this one would add two pools
# together and call the result a reading.
meters:
  - id: primary
    label: Primary quota
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: provider_defined
    source_format: json_path
    source_path: groups.buckets.remainingFraction
    reset_path: groups.buckets.resetTime
    reset_encoding: rfc3339
    optional: false
    meter_code: PRIMARY
