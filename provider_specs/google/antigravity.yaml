# Antigravity, Google's coding tool.
#
# Google publishes nothing about this surface, so it is an internal endpoint and
# stays unverified. Its own connector header states "This interface is
# UNOFFICIAL and may break."
#
# The reader is live. The request, its method, its body, its headers and its
# permitted statuses are Rust constants in
# apps/desktop/src-tauri/src/net.rs, documented there with the date they were
# observed, including the reason the user agent header is not optional. They are
# deliberately absent from this file.
#
# What the parser reads is stated once, in the meters block below.
#
# This file covers Antigravity specifically. Google's other surfaces, consumer
# Gemini, Gemini CLI, and the Gemini API, are and must stay separate credentials
# and separate spec files; see google/gemini-cli.yaml.

provider_id: google
product_id: antigravity
display_name: Antigravity

source:
  docs_url: packages/connectors/src/antigravity.ts
  reviewed_at: "2026-08-10"
  source_status: provisional

availability:
  requires_plan: any
  appears_after: quota_json_present
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: implemented

# The live collection block. See openai/codex.yaml for why no address, method or
# header appears in this file.
collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: antigravity_quota
      endpoint_id: antigravity_quota
      credential_kind: antigravity_session
      evidence_fixture: antigravity.sanitized_live.quota
      evidence_status: pending_capture
      last_verified_at: null

connections:
  - reader: experimental
    auth_mode: existing_local_cli
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  fixture_ids:
    - antigravity.provisional.quota
    - antigravity.sanitized_live.quota

# The response states remaining quota as a FRACTION between zero and one, per
# bucket, over two windows. Usage is one minus that fraction, and the meter
# below reports whichever window is binding, meaning the one that will stop the
# work first. The third party pool that rides the same subscription is a real
# second wallet and is deliberately not modelled here: it needs its own identity
# before it can have a meter, and folding it into this one would add two pools
# together and call the result a reading.
# The four honesty labels, in the exact words every surface must print.
#
# These are OpenLimiter's own vocabulary, not the provider's, and they are the
# whole answer to "how much should I trust this number". They live here because
# three surfaces have to say the same thing about one provider, and the way that
# goes wrong is each surface keeping its own copy until one of them softens a
# word. The desktop registry is generated from this block; a test proves the
# connector's own labels are identical to it.
honesty:
  connector_id: antigravity
  credential_origin: official-local-tool
  data_interface_status: internal-endpoint
  automation_risk: high
  verification: UNVERIFIED

meters:
  - id: primary
    label: Primary quota
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: provider_defined
    source_format: json_path
    source_path: groups.buckets.remainingFraction
    reset_path: groups.buckets.resetTime
    reset_encoding: rfc3339
    optional: false
    meter_code: PRIMARY
