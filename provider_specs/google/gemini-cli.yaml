# Gemini CLI reads a private Google Code Assist quota surface with the OAuth
# credential already stored by the official command line tool. The native
# collector first resolves the managed project and then requests quota buckets.
# Both addresses, methods, bodies, and headers are closed Rust constants in
# apps/desktop/src-tauri/src/net.rs. This registry names no destination.
#
# The official Gemini CLI source defines the private response shape, but Google
# does not publish it as a supported third party API. The reader therefore stays
# experimental and UNVERIFIED even though its frozen source derived fixture is
# tested by both TypeScript and Rust.

provider_id: google
product_id: gemini-cli
display_name: Gemini CLI

source:
  docs_url: https://github.com/google-gemini/gemini-cli/blob/main/packages/core/src/code_assist/server.ts
  reviewed_at: "2026-08-20"
  source_status: provisional

availability:
  requires_plan: any
  appears_after: local_cli_login
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: implemented

collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: gemini_cli_quota
      endpoint_id: gemini_cli_quota
      credential_kind: gemini_cli_session
      evidence_fixture: gemini-cli.official-source.quota
      evidence_status: documented
      last_verified_at: "2026-08-20"

connections:
  - reader: experimental
    auth_mode: existing_local_cli
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  fixture_ids:
    - gemini-cli.official-source.quota

honesty:
  connector_id: gemini_cli
  credential_origin: official-local-tool
  data_interface_status: internal-endpoint
  automation_risk: high
  verification: UNVERIFIED

meters:
  - id: gemini_3_1_pro_preview
    label: Gemini 3.1 Pro Preview
    kind: model_quota
    unit: percent_used
    scope: model
    window:
      kind: provider_defined
    source_format: json_path
    source_path: buckets.remainingFraction
    reset_path: buckets.resetTime
    reset_encoding: rfc3339
    optional: true
    meter_code: GEMINI_3_1_PRO_PREVIEW
  - id: gemini_3_flash_preview
    label: Gemini 3 Flash Preview
    kind: model_quota
    unit: percent_used
    scope: model
    window:
      kind: provider_defined
    source_format: json_path
    source_path: buckets.remainingFraction
    reset_path: buckets.resetTime
    reset_encoding: rfc3339
    optional: true
    meter_code: GEMINI_3_FLASH_PREVIEW
