# OpenCode Go usage.
#
# The desktop reads the sign in the opencode CLI saved on this computer, read
# only and never refreshed, or an OpenCode API key a person pasted. Either one
# is sent to a single endpoint OpenCode does not document, which answers the
# rolling, weekly and monthly windows as JSON. The address is a Rust constant in
# apps/desktop/src-tauri/src/net.rs and is deliberately absent from this file.

provider_id: opencode
product_id: opencode
display_name: OpenCode

headlineMeter: rolling
weeklyMeter: weekly
acquisitionSurfaces:
  - desktop
displaySurfaces:
  - desktop
  - rail
  - tray
  - cli_cache
  - web
  - phone
platforms:
  - windows
  - macos
  - linux
acquisitionMethod: remote_http_internal
d5Review: Internal provider interface; high automation risk and capture pending.
maturity: headline
directory:
  order: 6
  rowId: opencode/opencode
  label: OpenCode
  connectorId: opencode
  access: automatic

source:
  docs_url: packages/connectors/src/opencode.ts
  reviewed_at: "2026-11-03"
  source_status: provisional

availability:
  requires_plan: any
  appears_after: local_cli_login
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: implemented

collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: opencode_usage
      endpoint_id: opencode_usage
      credential_kind: opencode_api_key
      evidence_fixture: opencode.sanitized_live.usage
      evidence_status: pending_capture
      last_verified_at: null

connections:
  - reader: experimental
    auth_mode: existing_local_cli
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  fixture_ids:
    - opencode.provisional.usage
    - opencode.sanitized_live.usage

honesty:
  connector_id: opencode
  credential_origin: official-local-tool
  data_interface_status: internal-endpoint
  automation_risk: high
  verification: UNVERIFIED

meters:
  - id: rolling
    label: Rolling usage
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 18000
    source_format: json_path
    source_path: usage.rolling.percent
    reset_path: usage.rolling.resetsAt
    reset_encoding: rfc3339
    optional: false
    meter_code: FIVE_HOUR
  - id: weekly
    label: Weekly usage
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 604800
    source_format: json_path
    source_path: usage.weekly.percent
    reset_path: usage.weekly.resetsAt
    reset_encoding: rfc3339
    optional: false
    meter_code: SEVEN_DAY
  - id: monthly
    label: Monthly usage
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 2592000
    source_format: json_path
    source_path: usage.monthly.percent
    reset_path: usage.monthly.resetsAt
    reset_encoding: rfc3339
    optional: true
    meter_code: MONTHLY
