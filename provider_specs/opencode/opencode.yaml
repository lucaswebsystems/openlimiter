# OpenCode, and the riskiest reader in the registry.
#
# OpenCode publishes no usage interface of any kind. The plan percentages exist
# only inside the HTML of a logged in workspace page, which is why this reader is
# an authenticated scrape and why its four honesty labels do not improve with
# evidence: credentialOrigin browser-session, dataInterfaceStatus
# authenticated-scrape, automationRisk high, verification UNVERIFIED. Those
# describe the method, not how much is known about it. The connector carries the
# same statement as an explicit flag, opencodeHonesty.
#
# The reader is live. Both requests it makes, and the rule that the workspace
# handle between them is parsed out of a redirect rather than followed, are Rust
# constants and comments in apps/desktop/src-tauri/src/net.rs. They are
# deliberately absent from this file.
#
# What the parser reads is stated once, in the meters block below.

provider_id: opencode
product_id: opencode
display_name: OpenCode

source:
  docs_url: packages/connectors/src/opencode.ts
  reviewed_at: "2026-08-10"
  source_status: provisional

availability:
  requires_plan: any
  appears_after: browser_session_captured
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: implemented

# The live collection block, and the least trustworthy one in the registry.
# See the file header for what that means and where the requests are defined.
collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: opencode_usage
      endpoint_id: opencode_usage
      credential_kind: opencode_browser_session
      evidence_fixture: opencode.sanitized_live.usage
      evidence_status: pending_capture
      last_verified_at: null

connections:
  - reader: experimental
    auth_mode: manual
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  fixture_ids:
    - opencode.provisional.usage
    - opencode.sanitized_live.usage

# There is no path to this meter, because there is no interface. The number is
# rendered into the HTML of a logged in page beside a label, so the registry
# states the LABEL it is found by and states source_format html_label rather
# than inventing a dotted path to a document that has none. The reset is a
# countdown in words, "Resets in 5 days 20 hours", not a timestamp.
#
# The reader reports all three provider windows. Shared policy chooses the
# highest percentage when it needs one binding number. All three labels must be
# present for any of them to be believed: a page that has changed enough to lose
# one has changed enough not to be trusted for the other two.
# The four honesty labels, in the exact words every surface must print.
#
# These are OpenLimiter's own vocabulary, not the provider's, and they are the
# whole answer to "how much should I trust this number". They live here because
# three surfaces have to say the same thing about one provider, and the way that
# goes wrong is each surface keeping its own copy until one of them softens a
# word. The desktop registry is generated from this block; a test proves the
# connector's own labels are identical to it.
honesty:
  connector_id: opencode
  credential_origin: browser-session
  data_interface_status: authenticated-scrape
  automation_risk: high
  verification: UNVERIFIED

meters:
  - id: rolling
    label: Rolling usage
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 18000
    source_format: html_label
    source_label: Rolling Usage
    reset_path: null
    reset_encoding: duration_words
    optional: false
    meter_code: FIVE_HOUR
  - id: weekly
    label: Weekly usage
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 604800
    source_format: html_label
    source_label: Weekly Usage
    reset_path: null
    reset_encoding: duration_words
    optional: false
    meter_code: SEVEN_DAY
  - id: monthly
    label: Monthly usage
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: rolling
      duration_seconds: 2592000
    source_format: html_label
    source_label: Monthly Usage
    reset_path: null
    reset_encoding: duration_words
    optional: false
    meter_code: MONTHLY
