# OpenRouter credits, read from the documented credits endpoint.
#
# The one remote source in the registry so far, and the one meter stated in
# money rather than in a percentage. The percentage the product shows is
# computed from the two paths below; both are carried through so a surface can
# print the spend beside it.

provider_id: openrouter
product_id: api
display_name: OpenRouter

source:
  docs_url: https://openrouter.ai/docs/api-reference/get-credits
  reviewed_at: "2026-08-10"
  source_status: official

availability:
  requires_plan: any
  appears_after: credential_stored
  absence_is_error: true

# Parser, credential storage and a live reader all exist: the desktop probes
# this endpoint itself through the closed allowlist in
# apps/desktop/src-tauri/src/net.rs.
support:
  parser: implemented
  reader: implemented
  auth: implemented

# The live collection block. This provider is the one with a published response
# shape, so its evidence fixture is a documented one rather than a capture.
#
# KNOWN GAP, and it is a contract question rather than an omission: OpenRouter
# ships TWO readers, openrouter_key for an inference key and openrouter_credits
# for a management key, and this block holds one reader_id, one endpoint_id and
# one credential_kind. The inference path is stated here because it is the one
# the desktop offers first. Routing for BOTH paths is complete and exhaustively
# tested in reader_registry.rs; only this registry cannot yet express the
# second, and it must not be faked by inventing a shape the contract does not
# define.
collection:
  reader: implemented
  auth: implemented
  reader_id: openrouter_key
  endpoint_id: openrouter_key
  credential_kind: openrouter_inference_key
  evidence_fixture: openrouter.documented.credits
  evidence_status: documented
  last_verified_at: "2026-08-10"

connections:
  - reader: official_remote_api
    auth_mode: api_key
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  verified_provider_version: null
  fixture_ids:
    - openrouter.documented.credits

meters:
  - id: credits
    label: Credits
    kind: credits
    unit: percent_used
    scope: account
    window:
      kind: credit_balance
    source_path: data.total_usage
    limit_path: data.total_credits
    amount_currency: USD
    reset_path: null
    reset_encoding: none
    optional: false
    meter_code: CREDITS
