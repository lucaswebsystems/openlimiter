# OpenRouter credits, read from the documented credits endpoint.
#
# The one remote source in the registry so far, and the one meter stated in
# money rather than in a percentage. The percentage the product shows is
# computed from the two paths below; both are carried through so a surface can
# print the spend beside it.

provider_id: openrouter
product_id: api
display_name: OpenRouter

source:
  docs_url: https://openrouter.ai/docs/api-reference/get-credits
  reviewed_at: "2026-08-10"
  source_status: official

availability:
  requires_plan: any
  appears_after: credential_stored
  absence_is_error: true

# Parser, credential storage and a live reader all exist: the desktop probes
# this endpoint itself through the closed allowlist in
# apps/desktop/src-tauri/src/net.rs.
support:
  parser: implemented
  reader: implemented
  auth: implemented

# The live collection block. This provider is the one with a published response
# shape, so its evidence fixture is a documented one rather than a capture.
#
# Both readers, which is why the block holds a list. An inference key can only
# read its own limit, so it reaches the key endpoint; a management key reads the
# account's credits. Two addresses, two credential kinds, one product. The
# routing for both is exhaustively tested in reader_registry.rs, and the
# registry now says the same thing the Rust does.
#
# The credits reader is the one interface in this registry with a published
# response shape, so its evidence is a documented fixture rather than a capture.
# The key reader shares that document: the same page publishes both responses.
collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: openrouter_key
      endpoint_id: openrouter_key
      credential_kind: openrouter_inference_key
      evidence_fixture: openrouter.documented.credits
      evidence_status: documented
      last_verified_at: "2026-08-10"
    - reader_id: openrouter_credits
      endpoint_id: openrouter_credits
      credential_kind: openrouter_management_key
      evidence_fixture: openrouter.documented.credits
      evidence_status: documented
      last_verified_at: "2026-08-10"

connections:
  - reader: official_remote_api
    auth_mode: api_key
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  verified_provider_version: null
  fixture_ids:
    - openrouter.documented.credits

# The four honesty labels, in the exact words every surface must print.
#
# These are OpenLimiter's own vocabulary, not the provider's, and they are the
# whole answer to "how much should I trust this number". They live here because
# three surfaces have to say the same thing about one provider, and the way that
# goes wrong is each surface keeping its own copy until one of them softens a
# word. The desktop registry is generated from this block; a test proves the
# connector's own labels are identical to it.
honesty:
  connector_id: openrouter
  credential_origin: user-key
  data_interface_status: documented-api
  automation_risk: low
  verification: UNVERIFIED

meters:
  - id: credits
    label: Credits
    kind: credits
    unit: percent_used
    scope: account
    window:
      kind: credit_balance
    source_path: data.total_usage
    limit_path: data.total_credits
    amount_currency: USD
    reset_path: null
    reset_encoding: none
    optional: false
    meter_code: CREDITS
