# Augment Code. Registered for the 2.1 providers wave, switched off.
#
# Route, from the providers research of 2026-09-29: the official account
# status command of the installed Auggie CLI, with its documented JSON output,
# run as the vendor's own executable with no shell and a bounded timeout, and
# with automatic updates disabled for the run by the documented mechanism. The
# CLI's own session is the credential; OpenLimiter never reads or rewrites it.
# Personal scope only: an organisation answer is not shown as a personal one.
# An expired session is unavailable and never starts a login or a refresh.
#
# Behind the live gate: until a supported runtime has been observed live on an
# account Lucas has, this provider ships as detection plus Needs attention
# only, never a number.
#
# Skeleton: nothing below claims a reader, a meter or a surface, and the
# compiled registry does not contain it.

