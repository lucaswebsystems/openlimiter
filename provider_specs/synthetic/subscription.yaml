# Synthetic. Registered for the 2.1 providers wave, switched off.
#
# Route, from the providers research of 2026-09-29: a documented quota API,
# read with the person's own key. The key is entered in the app and kept in the
# operating system credential store, or read from a client configuration whose
# configured endpoint is proven to be Synthetic's own. The answer carries the
# quota windows with usage, limit and renewal, and a quota query consumes no
# quota. The reader shows exactly the windows returned and never assumes that
# a renewal restores the whole allowance.
#
# Skeleton: nothing below claims a reader, a meter or a surface, and the
# compiled registry does not contain it. Its lane states the meters from a
# captured response, adds the collection, honesty and directory blocks, and
# sets enabled to true in the same change that switches the provider on.

