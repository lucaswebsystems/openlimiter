# Codex, OpenAI's coding CLI.
#
# OpenAI publishes no consumer quota interface, so this is an internal endpoint
# and every surface says so: source_status provisional, verification unverified,
# and the connector's own header comment states "This interface is UNOFFICIAL
# and may break."
#
# The reader is live. The request it makes, its method, its headers and its
# permitted statuses are Rust constants in
# apps/desktop/src-tauri/src/net.rs, documented there with the date they were
# observed. They are deliberately absent from this file: a registry that names
# an address is a registry that appears to choose one.
#
# What the parser reads is stated once, in the meters block below, and nothing
# here paraphrases it. The last time this file described the parser in prose,
# the prose went stale and described a shape the code had stopped reading.

provider_id: openai
product_id: codex
display_name: Codex

source:
  docs_url: packages/connectors/src/codex.ts
  reviewed_at: "2026-08-10"
  source_status: provisional

availability:
  requires_plan: any
  appears_after: usage_json_present
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: implemented

# The live collection block. Every identifier below is closed: the same words
# appear in apps/desktop/src-tauri/src/reader_registry.rs, in the desktop
# window's wire vocabulary, and here. The address, the method, the headers and
# the permitted statuses are NOT here and never will be: they are Rust
# constants, so no YAML file, no IPC payload and no provider response can move
# where a credential is sent.
collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: codex_usage
      endpoint_id: codex_usage
      credential_kind: codex_session
      evidence_fixture: codex.sanitized_live.usage
      evidence_status: pending_capture
      last_verified_at: null

connections:
  - reader: experimental
    auth_mode: existing_local_cli
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  fixture_ids:
    - codex.provisional.usage
    - codex.sanitized_live.usage

# The window is provider_defined rather than a fixed rolling length because the
# payload states its own: limit_window_seconds. A registry that hard coded five
# hours would be describing a plan rather than the interface, and the parser
# reports an unknown window when the field is absent rather than assuming one.
# The four honesty labels, in the exact words every surface must print.
#
# These are OpenLimiter's own vocabulary, not the provider's, and they are the
# whole answer to "how much should I trust this number". They live here because
# three surfaces have to say the same thing about one provider, and the way that
# goes wrong is each surface keeping its own copy until one of them softens a
# word. The desktop registry is generated from this block; a test proves the
# connector's own labels are identical to it.
honesty:
  connector_id: codex
  credential_origin: official-local-tool
  data_interface_status: internal-endpoint
  automation_risk: high
  verification: UNVERIFIED

meters:
  - id: primary
    label: Primary window
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: provider_defined
    source_format: json_path
    source_path: rate_limit.primary_window.used_percent
    reset_path: rate_limit.primary_window.reset_at
    reset_encoding: unix_seconds
    optional: false
    meter_code: PRIMARY
