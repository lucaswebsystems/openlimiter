# Kiro, its monthly credits.
#
# The desktop reads the sign in the Kiro CLI saved in its state database,
# data.sqlite3 in kiro-cli under Application Support on macOS and the XDG
# data folder on Linux: table auth_kv, key kirocli:odic:token (a JSON token,
# access_token and expires_at), and table state, key
# api.codewhisperer.profile (a JSON profile whose arn the request names). The
# database is opened read only on its live WAL, never copied, never written.
# The token lasts about an hour and the Kiro CLI renews it; it is never
# refreshed here, and an expired one shows the reopen sentence.
#
# Verified in source: CodexBar (Sources/CodexBarCore/Providers/Kiro/
# KiroUsageLimitsAPI.swift) reads the same rows and posts GetUsageLimits to
# the us-east-1 service with Content-Type application/x-amz-json-1.0,
# X-Amz-Target AmazonCodeWhispererService.GetUsageLimits, Bearer and the
# body {"profileArn"}; it reads usageBreakdownList's CREDIT entry
# (currentUsageWithPrecision, currentOveragesWithPrecision,
# usageLimitWithPrecision, nextDateReset in epoch seconds). The token's
# expires_at is RFC3339 in the Amazon Q Developer CLI the Kiro CLI continues
# (aws/amazon-q-developer-cli, crates/chat-cli/src/auth/builder_id.rs,
# BuilderIdToken); Kiro's own CLI source is not public. AWS documents none of
# this for Kiro. The address is a Rust constant in
# apps/desktop/src-tauri/src/net.rs, and the body is built there from one
# validated profile.
#
# Not read: a profile in any region but us-east-1 (CodexBar also knows
# eu-central-1's service; only us-east-1 is in the allowlist, so such a sign
# in shows that it is not read yet), and the Kiro CLI on Windows, whose folder
# no source confirms.

