# Cline hosted account balance. Registered for the 2.1 providers wave,
# switched off.
#
# Route, from the providers research of 2026-09-29: the documented account
# and balance endpoints, read with the account token Cline already stores. The
# account endpoint names the account, the balance endpoint answers for it. The
# token is read only from a Cline provider configuration proven to be Cline's
# own hosted account, never from an arbitrary external provider. Cline's token
# refresh and configuration migration are never invoked: an expired token is
# unavailable. This is the hosted credit balance only. Cline with external API
# keys has no allowance of its own, and ClinePass windows need their own
# documented fields; neither is measured here.
#
# Skeleton: nothing below claims a reader, a meter or a surface, and the
# compiled registry does not contain it.

