# Kilo Code. Registered for the 2.1 providers wave, switched off.
#
# Route, from the providers research of 2026-09-29: the structured profile
# command of the installed Kilo runtime, with JSON output, run as the vendor's
# own executable with no shell and a bounded timeout. Its local data directory
# and authentication file are presence markers only. Balance first: the credit
# balance is shown as returned, and no subscription percentage is derived from
# cumulative purchases or session costs. Local token statistics are not an
# account entitlement and are never shown as one.
#
# Behind the live gate: until a supported runtime has been observed live on an
# account Lucas has, this provider ships as detection plus Needs attention
# only, never a number.
#
# Skeleton: nothing below claims a reader, a meter or a surface, and the
# compiled registry does not contain it.

