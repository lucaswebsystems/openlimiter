# MiniMax Token Plan. Registered for the 2.1 providers wave, switched off.
#
# Route, from the providers research of 2026-09-29: the documented Token Plan
# quota endpoint, read with the person's own subscription key. The key is
# entered in the app, or read from a client configuration whose configured
# endpoint is proven to be MiniMax's own. A generic MiniMax API key is not
# automatically a Token Plan credential. The documentation describes a five
# hour and a weekly window. Model entries are never summed unless the answer
# proves they share one pool.
#
# Skeleton: nothing below claims a reader, a meter or a surface, and the
# compiled registry does not contain it.

