# Kilo Code, and its account balance.
#
# The desktop reads the sign in Kilo's CLI saved: auth.json in Kilo's data
# folder, which Kilo resolves with xdg-basedir on every system (Windows
# included), field kilo, an oauth value whose access token is sent. Read
# only and never refreshed. A legacy login stating expires 0 has an unknown
# expiry, not a past one.
#
# Verified in source (Kilo-Org/kilocode at 080ca6c, MIT): packages/core
# global.ts places the data folder, packages/opencode/src/auth/index.ts
# defines the store, and packages/kilo-gateway/src/api/profile.ts reads the
# balance route with a Bearer token and the balance field, in US dollars.
# Kilo documents none of this. The address is a Rust constant in
# apps/desktop/src-tauri/src/net.rs.
#
# Not read: an organization's balance. Kilo sends the organization chosen at
# sign in as a request header; OpenLimiter sends no header taken from a file,
# so the balance shown is the personal account's. Also not read: the Kilo
# Pass state, a tRPC batch procedure with an input envelope rather than a
# plain read.

