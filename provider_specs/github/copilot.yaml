# GitHub Copilot, and its premium request and chat quotas.
#
# The desktop reads the sign in the GitHub Copilot editor and language server
# saved: apps.json under local application data on Windows and ~/.config
# elsewhere, the entry github.com:Iv1.b507a08c87ecfe98 (the GitHub Copilot
# OAuth app), field oauth_token, account user. An entry for any other host,
# an enterprise one included, or any other app is never read. Read only; the
# token does not expire and is never refreshed. No generic GitHub credential
# is read: never gh auth token, never a GitHub CLI login.
#
# Verified in source: Crush (charmbracelet/crush, internal/oauth/copilot/
# disk.go) reads the same file, key and field; CodexBar (Sources/CodexBarCore/
# Providers/Copilot/CopilotUsageFetcher.swift) reads the address below with
# that app's OAuth token as Authorization: token <t>, and
# CopilotUsageModels.swift the reply: quota_snapshots.premium_interactions and
# quota_snapshots.chat, percent used = 100 minus percent_remaining, unlimited
# draws no bar, reset at quota_reset_date. GitHub documents none of it. The
# address is a Rust constant in apps/desktop/src-tauri/src/net.rs, and the
# request carries no editor or plugin header: CodexBar sends ones that claim
# to be VS Code, this does not, and whether the address answers without them
# is verified on the first install that has a Copilot login.
#
# Not read: the Copilot CLI's own login. The current Copilot CLI keeps it in
# the system credential store under copilot-cli, or in ~/.copilot/config.json
# when no store is available, and both formats live in the CLI's native
# runtime: the npm bundle (@github/copilot-win32-x64 1.0.105) states the
# service name but no readable account name or value format, so neither is
# read. GitHub's documented billing usage API (docs.github.com/en/rest/
# billing/usage) needs a personal access token and is not read either.

provider_id: github
product_id: copilot
display_name: GitHub Copilot

headlineMeter: premium
acquisitionSurfaces:
  - desktop
displaySurfaces:
  - desktop
  - rail
  - tray
  - cli_cache
  - web
  - phone
platforms:
  - windows
  - macos
  - linux
acquisitionMethod: remote_http_internal
d5Review: Reads the sign in the Copilot editor login saved, read only and never refreshed. Only api.github.com receives the token, for the github.com Copilot app alone. Honest OpenLimiter identity, no editor header.
maturity: experimental
directory:
  order: 14
  rowId: github/copilot
  label: GitHub Copilot
  connectorId: copilot
  access: automatic

source:
  docs_url: null
  reviewed_at: "2026-11-04"
  source_status: provisional

availability:
  requires_plan: any
  appears_after: local_cli_login
  absence_is_error: false

support:
  parser: implemented
  reader: implemented
  auth: implemented

collection:
  reader: implemented
  auth: implemented
  readers:
    - reader_id: copilot_user
      endpoint_id: copilot_user
      credential_kind: copilot_session
      evidence_fixture: copilot.provisional.user
      evidence_status: pending_capture
      last_verified_at: null

connections:
  - reader: experimental
    auth_mode: existing_local_cli
    platforms:
      - windows
      - macos
      - linux

verification:
  verification_status: unverified
  last_verified_at: null
  fixture_ids:
    - copilot.provisional.user
    - copilot.live.pending

honesty:
  connector_id: copilot
  credential_origin: official-local-tool
  data_interface_status: internal-endpoint
  automation_risk: high
  verification: UNVERIFIED

meters:
  - id: premium
    label: Premium requests
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: calendar_month
    source_format: json_path
    source_path: quota_snapshots.premium_interactions.percent_remaining
    reset_path: quota_reset_date
    reset_encoding: iso8601
    optional: true
    meter_code: PREMIUM
  - id: chat
    label: Chat
    kind: subscription_quota
    unit: percent_used
    scope: account
    window:
      kind: calendar_month
    source_format: json_path
    source_path: quota_snapshots.chat.percent_remaining
    reset_path: quota_reset_date
    reset_encoding: iso8601
    optional: true
    meter_code: CHAT
