name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should OpenLimiter solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy
      description: Explain effects on secrets, cache state, agent context, and network egress.
    validations:
      required: true
