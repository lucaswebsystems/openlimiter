version: 2
updates:
  # Workspace packages (core, connectors, cli, adapters).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine updates arrive as one pull request instead of a wall of them.
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
    labels:
      - dependencies
  # Toolchain majors land deliberately, on their own slower cadence, so they
  # stay visible instead of being silently ignored.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - major
    allow:
      - dependency-name: typescript
      - dependency-name: vitest
      - dependency-name: "@types/node"

  # The marketing site keeps its own lockfile, so it needs its own entry or it
  # would never receive a security update.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - web

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
