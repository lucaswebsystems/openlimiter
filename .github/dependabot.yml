# Policy (Lucas, 2026-08-10): no commit authored by a bot is ever accepted in
# this repository. Dependabot runs in alerts only mode: every ecosystem below
# has open-pull-requests-limit 0, so it scans and surfaces vulnerability alerts
# but never opens or pushes anything. Dependency updates are done by the team,
# deliberately: an agent proposes bumps with changelogs read, review happens,
# and a human identity authors the commit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
