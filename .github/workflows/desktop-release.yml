name: Desktop release

# Windows and macOS installers are intentionally unsigned. The macOS artifact
# is a full download with the documented Gatekeeper override, but it is never
# an updater target until signing and notarisation are available.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the installers to"
        required: true
        type: string
      verify_existing:
        description: "Verify installers already attached to the draft without replacing them"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.verify_existing }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            rust_targets: x86_64-unknown-linux-gnu
            cache_target: x86_64-unknown-linux-gnu
            updater: true
            args: "--bundles appimage,deb,rpm"
          - os: windows-latest
            label: Windows
            rust_targets: x86_64-pc-windows-msvc
            cache_target: x86_64-pc-windows-msvc
            updater: true
            args: "--bundles nsis,msi"
          - os: macos-14
            label: macOS universal unsigned
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            cache_target: universal-apple-darwin
            updater: false
            args: "--target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos-unsigned.conf.json"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xvfb

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.cache_target }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the desktop engine mirrors
        run: pnpm build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Generate icons
        working-directory: apps/desktop
        run: node scripts/icons.mjs

      - name: Assemble the desktop user interface
        working-directory: apps/desktop
        run: node scripts/build-ui.mjs

      - name: Verify release configuration and required public build variables
        env:
          OPENLIMITER_SUPABASE_URL: ${{ vars.OPENLIMITER_SUPABASE_URL }}
          OPENLIMITER_SUPABASE_ANON_KEY: ${{ vars.OPENLIMITER_SUPABASE_ANON_KEY }}
          OPENLIMITER_PRO_URL: ${{ vars.OPENLIMITER_PRO_URL }}
        run: node .github/scripts/verify-desktop-release-config.mjs

      - name: Verify updater signing secret encoding
        if: matrix.updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          node -e 'const key = process.env.TAURI_SIGNING_PRIVATE_KEY || ""; const bytes = Buffer.from(key, "utf8"); if (!bytes.length) throw new Error("Updater signing secret is missing"); if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) throw new Error("Updater signing secret has a UTF 8 BOM"); if (![...bytes].every((byte) => byte >= 32 && byte <= 126)) throw new Error("Updater signing secret must contain ASCII text only"); console.log("Updater signing secret encoding verified");'

      - name: Build and attach the unsigned installers
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          OPENLIMITER_SUPABASE_URL: ${{ vars.OPENLIMITER_SUPABASE_URL }}
          OPENLIMITER_SUPABASE_ANON_KEY: ${{ vars.OPENLIMITER_SUPABASE_ANON_KEY }}
          OPENLIMITER_PRO_URL: ${{ vars.OPENLIMITER_PRO_URL }}
          OPENLIMITER_PRO_PUBLIC_KEYS: ${{ vars.OPENLIMITER_PRO_PUBLIC_KEYS }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: OpenLimiter ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the Windows installer installs and launches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The Windows NSIS installer was not produced"
          }
          & ./.github/scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Verify the Linux package installs and launches
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$package_file" ]; then
            echo "The Linux deb package was not produced" >&2
            exit 1
          fi
          bash .github/scripts/verify-linux-package.sh "$package_file"

      - name: Verify the unsigned macOS bundles have no updater artifacts
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          app_bundle="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg_bundle="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$app_bundle" ] || [ -z "$dmg_bundle" ]; then
            echo "The unsigned macOS app and dmg were not both produced" >&2
            exit 1
          fi
          if find "$bundle_root" -type f \( -name '*.sig' -o -name '*updater*' \) -print -quit | grep -q .; then
            echo "Unsigned macOS produced an updater artifact" >&2
            exit 1
          fi

  verify_existing:
    if: ${{ inputs.verify_existing }}
    name: Verify existing ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            pattern: "*.deb"
          - os: windows-latest
            label: Windows
            pattern: "*_x64-setup.exe"
          - os: macos-14
            label: macOS unsigned
            pattern: "*.dmg"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux launch dependency
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo timeout 180s apt-get update
          sudo timeout 180s apt-get install -y xvfb

      - name: Download the existing draft installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HTTP_TIMEOUT: 30
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/openlimiter-release"
          mkdir -p "$artifact_dir"
          timeout 120s gh release download "$TAG" --repo "$REPO" --pattern "$PATTERN" --dir "$artifact_dir"

      - name: Verify the existing Windows installer installs and launches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/openlimiter-release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The downloaded Windows installer was not found"
          }
          & ./.github/scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Verify the existing Linux package installs and launches
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find "$RUNNER_TEMP/openlimiter-release" -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$package_file" ]; then
            echo "The downloaded Linux package was not found" >&2
            exit 1
          fi
          bash .github/scripts/verify-linux-package.sh "$package_file"

      - name: Verify the existing macOS disk image is present
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          dmg_file="$(find "$RUNNER_TEMP/openlimiter-release" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg_file" ]; then
            echo "The downloaded macOS disk image was not found" >&2
            exit 1
          fi

  verify_updater_manifest:
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || inputs.verify_existing) }}
    needs: [build]
    name: Verify updater manifest excludes unsigned macOS
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the assembled updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HTTP_TIMEOUT: 30
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openlimiter-updater"
          timeout 120s gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir "$RUNNER_TEMP/openlimiter-updater"

      - name: Verify updater endpoint, key, signatures, URLs, and platforms
        run: node .github/scripts/verify-desktop-release-config.mjs --config-only --manifest "$RUNNER_TEMP/openlimiter-updater/latest.json"
