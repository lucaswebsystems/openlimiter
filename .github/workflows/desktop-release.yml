name: Desktop release

# Launch artifacts are produced for Windows and Linux only. The Windows
# installers are intentionally unsigned, so SmartScreen can show its reputation
# warning. macOS remains deferred until signing and notarisation are available.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the installers to"
        required: true
        type: string
      verify_existing:
        description: "Verify installers already attached to the draft without replacing them"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.verify_existing }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,deb,rpm"
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis,msi"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xvfb

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the desktop engine mirrors
        run: pnpm build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Generate icons
        working-directory: apps/desktop
        run: node scripts/icons.mjs

      - name: Assemble the desktop user interface
        working-directory: apps/desktop
        run: node scripts/build-ui.mjs

      - name: Build and attach the unsigned installers
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: OpenLimiter ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the Windows installer installs and launches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The Windows NSIS installer was not produced"
          }
          & ./.github/scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Verify the Linux package installs and launches
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$package_file" ]; then
            echo "The Linux deb package was not produced" >&2
            exit 1
          fi
          bash .github/scripts/verify-linux-package.sh "$package_file"

  verify_existing:
    if: ${{ inputs.verify_existing }}
    name: Verify existing ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            pattern: "*.deb"
          - os: windows-latest
            label: Windows
            pattern: "*_x64-setup.exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux launch dependency
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo timeout 180s apt-get update
          sudo timeout 180s apt-get install -y xvfb

      - name: Download the existing draft installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HTTP_TIMEOUT: 30
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/openlimiter-release"
          mkdir -p "$artifact_dir"
          timeout 120s gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "${{ matrix.pattern }}" --dir "$artifact_dir"

      - name: Verify the existing Windows installer installs and launches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/openlimiter-release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The downloaded Windows installer was not found"
          }
          & ./.github/scripts/verify-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Verify the existing Linux package installs and launches
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find "$RUNNER_TEMP/openlimiter-release" -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$package_file" ]; then
            echo "The downloaded Linux package was not found" >&2
            exit 1
          fi
          bash .github/scripts/verify-linux-package.sh "$package_file"
