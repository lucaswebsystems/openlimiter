name: Desktop release

# Launch artifacts are produced for Windows and Linux only. The Windows
# installers are intentionally unsigned, so SmartScreen can show its reputation
# warning. macOS remains deferred until signing and notarisation are available.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the installers to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
            args: "--bundles appimage,deb,rpm"
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis,msi"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xvfb

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the desktop engine mirrors
        run: pnpm build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Generate icons
        working-directory: apps/desktop
        run: node scripts/icons.mjs

      - name: Assemble the desktop user interface
        working-directory: apps/desktop
        run: node scripts/build-ui.mjs

      - name: Build and attach the unsigned installers
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: OpenLimiter ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify the Windows installer installs and launches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The Windows NSIS installer was not produced"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "OpenLimiterInstalled"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -WindowStyle Hidden -PassThru
          if (-not $install.WaitForExit(120000)) {
            & "$env:SystemRoot/System32/taskkill.exe" /PID $install.Id /T /F | Out-Null
            throw "The Windows installer exceeded its two minute limit"
          }
          if ($install.ExitCode -ne 0) {
            throw "The Windows installer exited with code $($install.ExitCode)"
          }

          function Find-OpenLimiterApplication {
            $searchRoots = @(
              $installDir,
              (Join-Path $env:LOCALAPPDATA "OpenLimiter"),
              (Join-Path $env:LOCALAPPDATA "Programs/OpenLimiter"),
              (Join-Path $env:ProgramFiles "OpenLimiter")
            )
            if (${env:ProgramFiles(x86)}) {
              $searchRoots += Join-Path ${env:ProgramFiles(x86)} "OpenLimiter"
            }

            foreach ($root in $searchRoots) {
              if (Test-Path -LiteralPath $root) {
                $found = Get-ChildItem -LiteralPath $root -Recurse -Filter "OpenLimiter.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) {
                  return $found
                }
              }
            }

            $uninstallRoots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )
            foreach ($entry in Get-ItemProperty -Path $uninstallRoots -ErrorAction SilentlyContinue) {
              if ($entry.DisplayName -notlike "OpenLimiter*") {
                continue
              }
              if ($entry.DisplayIcon) {
                $iconPath = ($entry.DisplayIcon -replace ',[0-9]+$', '').Trim('"')
                if (Test-Path -LiteralPath $iconPath) {
                  return (Get-Item -LiteralPath $iconPath)
                }
              }
              if ($entry.InstallLocation) {
                $installedPath = Join-Path $entry.InstallLocation "OpenLimiter.exe"
                if (Test-Path -LiteralPath $installedPath) {
                  return (Get-Item -LiteralPath $installedPath)
                }
              }
            }
          }

          $application = $null
          for ($attempt = 0; $attempt -lt 10 -and -not $application; $attempt++) {
            $application = Find-OpenLimiterApplication
            if (-not $application) {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $application) {
            throw "The installed Windows application was not found"
          }

          $launched = Start-Process -FilePath $application.FullName -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 10
          if ($launched.HasExited) {
            throw "The installed Windows application exited during its launch smoke test"
          }
          Stop-Process -Id $launched.Id -Force
          Write-Output "Verified Windows install and launch: $($application.FullName)"

      - name: Verify the Linux package installs and launches
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(find apps/desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [ -z "$package_file" ]; then
            echo "The Linux deb package was not produced" >&2
            exit 1
          fi

          package_file="$(realpath "$package_file")"
          sudo timeout 180s apt-get install -y "$package_file"
          package_name="$(dpkg-deb -f "$package_file" Package)"
          application="$(dpkg -L "$package_name" | awk '/\/bin\// { print; exit }')"
          if [ -z "$application" ] || [ ! -x "$application" ]; then
            echo "The installed Linux application was not found" >&2
            exit 1
          fi

          set +e
          timeout 15s xvfb-run -a "$application"
          launch_status=$?
          set -e
          if [ "$launch_status" -ne 124 ]; then
            echo "The installed Linux application exited during its launch smoke test with code $launch_status" >&2
            exit 1
          fi
          echo "Verified Linux install and launch: $application"
