name: Release desktop builds

# Builds the desktop application on each operating system it targets and
# attaches the installers to the matching release. macOS and Linux artifacts
# cannot be produced on Windows, so the work happens on GitHub runners.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach the builds to, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS Apple silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS Intel
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the engine the application ships
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --ignore-workspace

      - name: Assemble the desktop interface
        working-directory: apps/desktop
        run: node scripts/build-ui.mjs

      - name: Build the desktop application
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
