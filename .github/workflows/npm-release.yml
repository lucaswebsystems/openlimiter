name: npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version already committed in every public package"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to authorize the registry write"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish public packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the reviewed npm client
        run: npm install --global npm@12.0.2

      - name: Verify owner authorization and versions
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${CONFIRMATION}" != "PUBLISH" ]; then
            echo "The confirmation value must be PUBLISH."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const manifests = [
            "packages/core/package.json",
            "packages/connectors/package.json",
            "packages/adapters/package.json",
            "packages/cli/package.json",
          ];

          for (const manifest of manifests) {
            const value = JSON.parse(fs.readFileSync(manifest, "utf8"));
            if (value.version !== process.env.EXPECTED_VERSION) {
              throw new Error(
                `${manifest} declares ${value.version}, expected ${process.env.EXPECTED_VERSION}`,
              );
            }
          }
          NODE

          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "Apply and commit the release changeset before publishing."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete verification suite
        run: pnpm test

      - name: Check public package types
        run: pnpm typecheck

      - name: Build public packages
        run: pnpm build

      - name: Inspect the CLI archive
        run: pnpm --filter openlimiter release:inspect

      - name: Plan remaining package publications
        id: release_plan
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          export NPM_GLOBAL_ROOT="$(npm root --global)"
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync } = require("node:fs");
          const { join } = require("node:path");
          // Use the semver implementation shipped with the reviewed npm client.
          const semver = require(join(process.env.NPM_GLOBAL_ROOT, "npm/node_modules/semver"));
          const version = process.env.EXPECTED_VERSION;
          if (!semver.valid(version)) throw new Error(`Invalid release version: ${version}`);
          for (const [id, name] of [
            ["core", "@openlimiter/core"],
            ["connectors", "@openlimiter/connectors"],
            ["adapters", "@openlimiter/adapters"],
            ["cli", "openlimiter"],
          ]) {
            let versions;
            try {
              versions = JSON.parse(execFileSync("npm", ["view", name, "versions", "--json"], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] }));
            } catch (error) {
              let code;
              try { code = JSON.parse(String(error.stdout)).error?.code; } catch {}
              if (code !== "E404") throw error;
              versions = [];
            }
            if (typeof versions === "string") versions = [versions];
            if (!Array.isArray(versions) || versions.some((value) => !semver.valid(value))) {
              throw new Error(`Invalid registry versions for ${name}`);
            }
            const newer = versions.find((value) => semver.gt(value, version));
            if (newer) throw new Error(`${name} already has newer version ${newer}; refusing ${version}`);
            const published = versions.includes(version);
            console.log(`${name}@${version}: ${published ? "already published, skipping" : "pending"}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `${id}=${!published}\n`);
          }
          NODE

      - name: Pack the exact archives
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          destination="${RUNNER_TEMP}/openlimiter-packages"
          mkdir -p "${destination}"

          for package in core connectors adapters cli; do
            pnpm --dir "packages/${package}" pack --pack-destination "${destination}"
          done

          test -f "${destination}/openlimiter-core-${EXPECTED_VERSION}.tgz"
          test -f "${destination}/openlimiter-connectors-${EXPECTED_VERSION}.tgz"
          test -f "${destination}/openlimiter-adapters-${EXPECTED_VERSION}.tgz"
          test -f "${destination}/openlimiter-${EXPECTED_VERSION}.tgz"

      - name: Publish core
        if: steps.release_plan.outputs.core == 'true'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-core-${EXPECTED_VERSION}.tgz" --access public --provenance

      - name: Publish connectors
        if: steps.release_plan.outputs.connectors == 'true'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-connectors-${EXPECTED_VERSION}.tgz" --access public --provenance

      - name: Publish adapters
        if: steps.release_plan.outputs.adapters == 'true'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-adapters-${EXPECTED_VERSION}.tgz" --access public --provenance

      - name: Publish CLI
        if: steps.release_plan.outputs.cli == 'true'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-${EXPECTED_VERSION}.tgz" --access public --provenance

      - name: Verify every exact version is published
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for name in @openlimiter/core @openlimiter/connectors @openlimiter/adapters openlimiter; do
            # The registry can lag a publish by a minute; retry before failing.
            actual=""
            for attempt in 1 2 3 4 5 6; do
              actual="$(npm view "${name}@${EXPECTED_VERSION}" version 2>/dev/null || true)"
              [ "$actual" = "$EXPECTED_VERSION" ] && break
              sleep 15
            done
            if [ "$actual" != "$EXPECTED_VERSION" ]; then
              echo "${name} reports ${actual}, expected ${EXPECTED_VERSION}."
              exit 1
            fi
          done
