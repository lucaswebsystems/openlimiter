name: npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version already committed in every public package"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to authorize the registry write"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish public packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the reviewed npm client
        run: npm install --global npm@12.0.2

      - name: Verify owner authorization and versions
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${CONFIRMATION}" != "PUBLISH" ]; then
            echo "The confirmation value must be PUBLISH."
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");

          const manifests = [
            "packages/core/package.json",
            "packages/connectors/package.json",
            "packages/adapters/package.json",
            "packages/cli/package.json",
          ];

          for (const manifest of manifests) {
            const value = JSON.parse(fs.readFileSync(manifest, "utf8"));
            if (value.version !== process.env.EXPECTED_VERSION) {
              throw new Error(
                `${manifest} declares ${value.version}, expected ${process.env.EXPECTED_VERSION}`,
              );
            }
          }
          NODE

          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "Apply and commit the release changeset before publishing."
            exit 1
          fi

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete verification suite
        run: pnpm test

      - name: Check public package types
        run: pnpm typecheck

      - name: Build public packages
        run: pnpm build

      - name: Inspect the CLI archive
        run: pnpm --filter openlimiter release:inspect

      - name: Confirm every version is unused
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          for name in \
            @openlimiter/core \
            @openlimiter/connectors \
            @openlimiter/adapters \
            openlimiter; do
            if npm view "${name}@${EXPECTED_VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${EXPECTED_VERSION} already exists."
              exit 1
            fi
          done

      - name: Pack the exact archives
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          destination="${RUNNER_TEMP}/openlimiter-packages"
          mkdir -p "${destination}"

          for package in core connectors adapters cli; do
            pnpm --dir "packages/${package}" pack --pack-destination "${destination}"
          done

          test -f "${destination}/openlimiter-core-${EXPECTED_VERSION}.tgz"
          test -f "${destination}/openlimiter-connectors-${EXPECTED_VERSION}.tgz"
          test -f "${destination}/openlimiter-adapters-${EXPECTED_VERSION}.tgz"
          test -f "${destination}/openlimiter-${EXPECTED_VERSION}.tgz"

      - name: Publish core
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-core-${{ inputs.version }}.tgz" --access public --provenance

      - name: Publish connectors
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-connectors-${{ inputs.version }}.tgz" --access public --provenance

      - name: Publish adapters
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-adapters-${{ inputs.version }}.tgz" --access public --provenance

      - name: Publish CLI
        run: npm publish "${RUNNER_TEMP}/openlimiter-packages/openlimiter-${{ inputs.version }}.tgz" --access public --provenance
