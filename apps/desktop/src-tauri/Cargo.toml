[package]
name = "openlimiter-desktop"
version = "0.1.0"
description = "A local quota meter for AI subscriptions, in a window and beside the clock."
authors = ["Lucas Costa"]
license = "Apache-2.0"
repository = "https://github.com/lucaswebsystems/openlimiter"
edition = "2021"
rust-version = "1.77.2"

# The binary is a thin shell around the library, which is what lets the same
# code be built for a desktop bundle and, later, for a mobile target.
[lib]
name = "openlimiter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon is the one feature this application actually needs beyond the core.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
