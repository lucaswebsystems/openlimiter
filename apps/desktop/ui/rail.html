<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenLimiter Rail</title>
  <link rel="stylesheet" href="engine/ui/tokens.css">
  <link rel="stylesheet" href="rail.css">
  <script type="module" src="rail.js"></script>
</head>
<body class="folded">
  <main id="surface" aria-label="OpenLimiter Rail">
    <button id="grip" class="tab tab-grip" type="button" aria-label="Move Rail along the edge. Use arrow keys."><span class="grip" aria-hidden="true"></span></button>
    <header id="card-heading"><img src="brand/openlimiter-mark.svg" alt=""><h1>Usage and agents</h1></header>
    <div id="accounts" aria-label="Accounts"></div>
    <div id="sessions" aria-label="Agent sessions"></div>
    <div class="controls">
    <button id="keep" type="button" aria-pressed="false">Keep open</button>
    <button id="close" type="button">Hide</button>
    </div>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
