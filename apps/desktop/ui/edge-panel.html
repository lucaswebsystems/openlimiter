<!doctype html>
<html lang="en">
<head>

  <title>OpenLimiter</title>
  <link rel="stylesheet" href="edge-tab.css">

<body data-surface="panel">
  <main class="edge-panel">
    <h1>Usage and agents</h1>

    <p>Your usage panel will appear here.</p>
